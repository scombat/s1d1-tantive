name: image

# Builds the small image from the Hub weights and runs it, on the pull requests that change what the image is made of
# (Dockerfile, lockfile, pinned weights). amd64 only: nothing is pushed, signed or attested here; build.yml does that on a tag.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - uv.lock
      - pyproject.toml
      - checksums/**
      - src/tantive/verify.py
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: uv run pytest -m docker -q

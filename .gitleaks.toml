title = "s1d1-tantive gitleaks configuration"

[extend]
# keep every default rule; nothing is disabled
useDefault = true

[[allowlists]]
description = "cosign.pub is a PUBLIC key, committed on purpose so images up to 0.5.0 can be verified (docs/verify.md); only this path is skipped"
paths = ['''^cosign\.pub$''']

[[allowlists]]
description = "Terraform examples under deploy/ reference the input variable `var.s1d1_api_key`; only a match whose value is exactly that reference is allowed, and only in those files (a literal key on the same line, or anywhere else, is still reported)"
paths = ['''^deploy/[^/]+/terraform/.*\.tf$''']
regexTarget = "match"
regexes = ['''var\.s1d1_api_key\s*[,}]?\s*$''']
